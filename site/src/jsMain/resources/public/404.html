<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found — Rok Retar</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&family=Instrument+Serif&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F6F3EC; --ink: #1C1A17; --ink2: #5E584E; --accent: #B24522; --accent-hover: #9A3A1B; --on-accent: #FBF8F2; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #151310; --ink: #EEE8DC; --ink2: #A79F90; --accent: #E27C54; --accent-hover: #EC926E; --on-accent: #151310; }
        }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--ink);
            font-family: Geist, system-ui, -apple-system, sans-serif;
            padding: 24px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 480px; text-align: center; }
        .code {
            font: 500 13px "Geist Mono", ui-monospace, monospace;
            color: var(--ink2);
            letter-spacing: 0.02em;
            margin-bottom: 16px;
        }
        h1 {
            font: 400 clamp(2.5rem, 6vw + 1rem, 4.5rem)/1 "Instrument Serif", Georgia, serif;
            letter-spacing: -0.015em;
            margin: 0 0 16px;
        }
        p { font-size: 16px; line-height: 1.65; color: var(--ink2); margin: 0 0 32px; }
        a {
            display: inline-block;
            padding: 12px 20px;
            background: var(--accent);
            color: var(--on-accent);
            text-decoration: none;
            font-weight: 500;
            border-radius: 6px;
            font-size: 15px;
            transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), background-color 160ms ease;
        }
        a:hover { background: var(--accent-hover); }
        a:active { transform: scale(0.97); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        /* The parrot tilts its head at the missing page, once, and again on hover. */
        .parrot {
            display: block;
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 18px;
            transform-origin: 50% 85%;
        }
        @media (prefers-reduced-motion: no-preference) {
            .parrot { animation: tilt 900ms cubic-bezier(0.23, 1, 0.32, 1) 400ms both; }
            @media (hover: hover) and (pointer: fine) {
                .parrot:hover { animation: tilt-again 900ms cubic-bezier(0.23, 1, 0.32, 1) both; }
            }
        }
        @keyframes tilt {
            0% { transform: none; }
            35% { transform: rotate(-14deg); }
            60% { transform: rotate(-11deg); }
            100% { transform: none; }
        }
        @keyframes tilt-again {
            0% { transform: none; }
            35% { transform: rotate(-14deg); }
            60% { transform: rotate(-11deg); }
            100% { transform: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="parrot" src="/parrot/parrot-icon.webp" width="72" height="72" alt="">
        <div class="code">404</div>
        <h1>Squawk. This page flew off.</h1>
        <p>The page you're looking for doesn't exist or has moved. The homepage is right where you left it.</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
