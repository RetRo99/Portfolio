<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found — Rok Retar</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #18181B;
            color: #FAFAFA;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        .container {
            max-width: 480px;
            text-align: center;
        }
        .code {
            font-family: "JetBrains Mono", ui-monospace, monospace;
            color: #F59E0B;
            font-size: 14px;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }
        h1 {
            font-size: clamp(1.875rem, 4vw + 0.5rem, 3rem);
            font-weight: 600;
            line-height: 1.1;
            margin: 0 0 16px;
            font-family: Outfit, Inter, sans-serif;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #A1A1AA;
            margin: 0 0 32px;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: #F59E0B;
            color: #18181B;
            text-decoration: none;
            font-weight: 600;
            border-radius: 999px;
            font-family: Inter, sans-serif;
            font-size: 14px;
        }
        a:hover {
            background: #E8940B;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">// 404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has moved. Return to the homepage to keep exploring.</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
